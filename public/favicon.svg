<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Minimalist Background Base -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Road Line -->
  <line x1="6" y1="48" x2="58" y2="48" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cargo Body (Slate Dark #263645) -->
  <rect x="23" y="19" width="35" height="23" rx="2" fill="#263645"/>
  <line x1="34" y1="21" x2="34" y2="40" stroke="#1E293B" stroke-width="1"/>
  <line x1="46" y1="21" x2="46" y2="40" stroke="#1E293B" stroke-width="1"/>
  <text x="40.5" y="33" fill="#94A3B8" font-family="'Bodoni Moda', serif" font-size="6" font-weight="700" letter-spacing="1" text-anchor="middle">HGT</text>

  <!-- Red Cab (Vermilion #E03E2D, facing left) -->
  <path d="M23 42H7V34L13 22H21C22.1046 22 23 22.8954 23 24V42Z" fill="#E03E2D"/>
  <path d="M14 24H20V32H9.5L14 24Z" fill="#1E293B"/>
  <!-- Amber Headlight -->
  <rect x="6.5" y="34.5" width="1.5" height="4" rx="0.75" fill="#FBBF24"/>
  <!-- Front Bumper -->
  <rect x="5.5" y="39.5" width="4" height="3" rx="0.5" fill="#1A242E"/>

  <!-- Chassis & Fuel Tank -->
  <rect x="23" y="40" width="35" height="3" fill="#263645"/>
  <rect x="25" y="42" width="16" height="3" rx="1" fill="#1A242E"/>

  <!-- Front Wheel (x=16, y=44) -->
  <circle cx="16" cy="44" r="5" fill="#333C48"/>
  <circle cx="16" cy="44" r="2.8" fill="#94A3B8"/>
  <circle cx="16" cy="44" r="1.2" fill="#1E293B"/>

  <!-- Rear Wheel (x=48, y=44) -->
  <circle cx="48" cy="44" r="5" fill="#333C48"/>
  <circle cx="48" cy="44" r="2.8" fill="#94A3B8"/>
  <circle cx="48" cy="44" r="1.2" fill="#1E293B"/>
</svg>
